name: Validate installer
on: [push, pull_request]
jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-yaml shellcheck
      - run: python3 -m unittest discover -v
      - run: for file in install.sh setup.sh menu.sh manage.sh; do bash -n "$file"; done
      - run: shellcheck install.sh setup.sh menu.sh manage.sh
      - run: bash install.sh --preview | tee /tmp/menu.txt; grep -q '18) 🚪 Exit' /tmp/menu.txt
